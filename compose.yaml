# Compose derives the project name from this directory. Set COMPOSE_PROJECT_NAME
# in .env (or use -p) when multiple checkouts have the same directory basename.
x-warp: &warp
  image: ${warp_IMAGE:-warp:cu128}
  platform: linux/amd64
  pull_policy: never
  init: true
  user: "${warp_UID:-1000}:${warp_GID:-1000}"
  shm_size: ${warp_SHM_SIZE:-16gb}
  environment: &environment
    HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
    TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
    WANDB_MODE: ${WANDB_MODE:-offline}
    warp_CUDA_COMPAT: ${warp_CUDA_COMPAT:-0}
  volumes:
    - type: bind
      source: ${warp_CACHE_DIR:-./.cache/docker}
      target: /cache
      bind:
        create_host_path: false
    - type: bind
      source: ${warp_OUTPUT_DIR:-./outputs}
      target: /outputs
      bind:
        create_host_path: false

services:
  serve:
    <<: *warp
    runtime: nvidia
    environment:
      <<: *environment
      warp_SERVER_URL: ws://127.0.0.1:8848
    command: [serve, --ckpt-dir, /checkpoint, --device, "cuda:0", --host, 0.0.0.0, --port, "8848"]
    ports:
      - "${warp_BIND_HOST:-127.0.0.1}:${warp_PORT:-8848}:8848"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${warp_GPU_ID:-0}"]
              capabilities: [gpu]
    volumes:
      - type: bind
        source: ${warp_CACHE_DIR:-./.cache/docker}
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ${warp_OUTPUT_DIR:-./outputs}
        target: /outputs
        bind:
          create_host_path: false
      - type: bind
        source: ${warp_CHECKPOINT_DIR:-./assets/warp_ckpt/warp_alpha/warp-Alpha-Sim-RoboTwin-Full}
        target: /checkpoint
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python, /opt/warp/docker/healthcheck.py, --timeout, "120"]
      interval: 60s
      timeout: 245s
      start_period: 10m
      retries: 5
    stop_grace_period: 60s

  train:
    <<: *warp
    runtime: nvidia
    profiles: [train]
    command: [train]
    gpus: all
    environment:
      <<: *environment
      CUDA_VISIBLE_DEVICES: ${warp_TRAIN_GPUS:-0}
    volumes:
      - type: bind
        source: ${warp_CACHE_DIR:-./.cache/docker}
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: ${warp_OUTPUT_DIR:-./outputs}
        target: /outputs
        bind:
          create_host_path: false
      - type: bind
        source: ${warp_ASSETS_DIR:-./assets}
        target: /opt/warp/assets
        bind:
          create_host_path: false
    stop_grace_period: 120s

  # CPU development shell; docker/compose.dev.yaml adds the source mounts. For GPU
  # development use that overlay with `run --rm train bash` instead.
  dev:
    <<: *warp
    profiles: [dev]
    command: [bash]
    stdin_open: true
    tty: true

  # No weights or dataset mount: validate exactly the image and GPUs selected
  # in .env, including multi-GPU NCCL when more than one device is selected.
  gpu-check:
    <<: *warp
    profiles: [check]
    runtime: nvidia
    gpus: all
    network_mode: none
    environment:
      <<: *environment
      CUDA_VISIBLE_DEVICES: ${warp_TRAIN_GPUS:-0}
    command: [python, /opt/warp/docker/gpu_smoke.py, --all-visible, --deepspeed]
